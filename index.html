<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>かぞくの手紙パスタ</title>
  <!-- Tailwind CSS & React CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-amber-50/30 text-gray-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const PRODUCTS = [
      {
        id: "bolognese",
        name: "和牛と完熟トマトの極上ボロネーゼ",
        tag: "一番人気",
        description: "淡路島産玉ねぎとじっくり煮込んだ肉感あふれる逸品",
        calories: "380kcal",
        image: "https://images.unsplash.com/photo-1551183053-bf91a1d81141?auto=format&fit=crop&q=80&w=800",
        badges: ["完全無添加", "高タンパク", "化学調味料ゼロ"]
      },
      {
        id: "genovese",
        name: "国産大葉と松の実の濃厚ジェノベーゼ",
        tag: "香り豊か",
        description: "大分県産の大葉を100%使用した爽やかで濃厚な味わい",
        calories: "320kcal",
        image: "https://images.unsplash.com/photo-1595295333158-4742f28fbd85?auto=format&fit=crop&q=80&w=800",
        badges: ["完全無添加", "国産大葉100%", "着色料ゼロ"]
      },
      {
        id: "carbonara",
        name: "無塩せきベーコンの濃厚カルボナーラ",
        tag: "子供に人気",
        description: "発色剤不使用ベーコンと厳選チーズのやさしいコク",
        calories: "410kcal",
        image: "https://images.unsplash.com/photo-1612874742237-6526221588e3?auto=format&fit=crop&q=80&w=800",
        badges: ["完全無添加", "無塩せき肉", "保存料ゼロ"]
      }
    ];

    function App() {
      const [quantities, setQuantities] = useState({ bolognese: 2, genovese: 1, carbonara: 1 });
      const [customLetter, setCustomLetter] = useState("体に気をつけてしっかり食べてね！応援してるよ。");

      const handleQuantityChange = (id, delta) => {
        setQuantities(prev => ({ ...prev, [id]: Math.max(0, prev[id] + delta) }));
      };

      const totalQuantity = Object.values(quantities).reduce((a, b) => a + b, 0);

      return (
        <div className="min-h-screen pb-12">
          {/* ナビゲーションバー */}
          <nav className="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-amber-100 shadow-sm">
            <div className="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <div className="bg-orange-500 text-white p-2 rounded-xl shadow-md font-bold">
                  ❤️
                </div>
                <div>
                  <span className="font-bold text-lg tracking-tight text-gray-900 block leading-tight">かぞくの手紙パスタ</span>
                  <span className="text-[10px] text-amber-700 font-medium">離れて暮らす大切な人へ贈る無添加パスタソース</span>
                </div>
              </div>
            </div>
          </nav>

          <main className="max-w-4xl mx-auto px-4 py-8 space-y-8">
            {/* ヒーローセクション */}
            <section className="bg-gradient-to-br from-orange-500 via-amber-500 to-orange-600 rounded-3xl p-8 text-white shadow-xl">
              <span className="inline-block bg-white/20 text-white text-xs px-3 py-1 rounded-full font-medium mb-3">
                ✨ 完全無添加・冷凍パスタソース仕送り便
              </span>
              <h1 className="text-2xl md:text-3xl font-extrabold leading-tight mb-2">
                「元気でやってる？」<br />言葉の代わりに、温かいスープとパスタを。
              </h1>
              <p className="text-orange-100 text-sm leading-relaxed">
                一人暮らしのお子様やご両親へ。栄養満点で化学調味料一切不使用のパスタソースに、あなた自筆のオリジナル手紙を添えてお届けします。
              </p>
            </section>

            {/* 商品一覧 */}
            <section className="space-y-4">
              <h2 className="text-xl font-bold text-gray-900 text-center">100%無添加 パスタソースラインナップ</h2>
              <div className="grid md:grid-cols-3 gap-6">
                {PRODUCTS.map((product) => (
                  <div key={product.id} className="bg-white rounded-2xl border shadow-sm overflow-hidden flex flex-col">
                    <div className="relative h-48">
                      <img src={product.image} alt={product.name} className="w-full h-full object-cover" />
                      <span className="absolute top-3 left-3 bg-orange-500 text-white text-xs px-2.5 py-1 rounded-full font-bold">
                        {product.tag}
                      </span>
                    </div>
                    <div className="p-4 flex-1 flex flex-col justify-between space-y-3">
                      <div>
                        <h3 className="font-bold text-gray-900 leading-snug">{product.name}</h3>
                        <p className="text-xs text-gray-500 mt-1">{product.description}</p>
                      </div>
                      <div className="flex items-center justify-between border-t pt-3">
                        <span className="text-xs text-gray-400">{product.calories}</span>
                        <div className="flex items-center border rounded-lg bg-gray-50">
                          <button onClick={() => handleQuantityChange(product.id, -1)} className="px-2 py-1 text-gray-600 font-bold">-</button>
                          <span className="px-3 font-bold text-sm">{quantities[product.id]}</span>
                          <button onClick={() => handleQuantityChange(product.id, 1)} className="px-2 py-1 text-gray-600 font-bold">+</button>
                        </div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </section>

            {/* 手紙 */}
            <section className="bg-white rounded-2xl p-6 border border-amber-100 shadow-sm space-y-3">
              <h3 className="font-bold text-orange-600 flex items-center gap-2">💌 同梱する仕送りメッセージ（無料）</h3>
              <textarea
                value={customLetter}
                onChange={(e) => setCustomLetter(e.target.value)}
                className="w-full h-20 p-3 border rounded-xl text-sm focus:outline-none bg-amber-50/20"
              />
            </section>

            {/* 購入ボタン */}
            <section className="bg-orange-500 text-white p-6 rounded-2xl shadow-lg flex items-center justify-between">
              <div>
                <p className="text-xs text-orange-100">選択中: 合計 {totalQuantity} 食</p>
                <p className="text-2xl font-extrabold">¥3,200 <span className="text-xs font-normal">（全国送料・税込）</span></p>
              </div>
              <button onClick={() => alert("注文手続き画面に進みます")} className="bg-white text-orange-600 font-bold px-6 py-3 rounded-xl hover:bg-orange-50 transition-colors shadow-md">
                仕送りセットを注文する
              </button>
            </section>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
